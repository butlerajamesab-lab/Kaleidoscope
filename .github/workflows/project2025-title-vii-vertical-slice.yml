name: Project 2025 Title VII vertical slice

on:
  pull_request:
    paths:
      - "contracts/project2025-vertical-slice-read-model.v1.json"
      - "docs/PROJECT2025_TITLE_VII_VERTICAL_SLICE_V1.md"
      - "docs/SOURCE_READING_LEDGER_PROJECT2025_TITLE_VII_V1.md"
      - "fixtures/project2025-title-vii-*.json"
      - "fixtures/project2025-title-vii-vertical-slice.v1.mjs"
      - "lenses/*.v1.json"
      - "scripts/emit-project2025-title-vii-read-model.mjs"
      - "src/project2025-vertical-slice.mjs"
      - "test/project2025-vertical-slice.test.mjs"
      - ".github/workflows/project2025-title-vii-vertical-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse contracts and manifests
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('contracts/project2025-vertical-slice-read-model.v1.json','utf8'))"
          for file in lenses/*.v1.json; do node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'))" "$file"; done
      - name: Run deterministic vertical-slice tests
        run: node --test test/project2025-vertical-slice.test.mjs
      - name: Re-emit frontend read model and receipt
        run: node scripts/emit-project2025-title-vii-read-model.mjs
      - name: Prove emitted artifacts are byte-stable
        run: git diff --exit-code -- fixtures/project2025-title-vii-read-model.v1.json fixtures/project2025-title-vii-receipt.v1.json
