name: Scenario lens freeze concurrency
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-scenario-lens-freeze-concurrency.py'
      - '.github/workflows/scenario-lens-freeze-sql.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-scenario-lens-freeze-concurrency.py'
      - '.github/workflows/scenario-lens-freeze-sql.yml'
permissions:
  contents: read
jobs:
  freeze-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Initialize disposable database
        run: |
          supabase init --yes
          supabase db start
      - name: Reproduce the reported race against unmodified historical migrations
        run: |
          supabase db reset --local --no-seed --version 20261018093000
          python scripts/verify-scenario-lens-freeze-concurrency.py --baseline
      - name: Replay every source migration and prove the remedy
        run: |
          supabase db reset --local --no-seed
          python scripts/verify-scenario-lens-freeze-concurrency.py
