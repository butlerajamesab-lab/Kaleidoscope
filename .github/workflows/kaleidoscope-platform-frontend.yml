name: Kaleidoscope platform frontend

on:
  pull_request:
    paths:
      - "public/kaleidoscope-app.*"
      - "src/platform-frontend-shell.mjs"
      - "src/server.mjs"
      - "test/platform-frontend-shell.test.mjs"
      - "fixtures/eeoc_demographics_reporting_rollback_2026.*"
      - "source_bundles/eeoc_demographics_reporting_rollback_2026.legislation_sources.v1.json"
      - "receipts/kaleidoscope_supabase_projection_substrate_2026_08_09.v1.json"
      - "supabase/migrations/20260809144457_kaleidoscope_projection_substrate_indexes.sql"
      - "docs/KALEIDOSCOPE_PLATFORM_FRONTEND_V1.md"
      - "FOUNDATION.md"
      - "README.md"
      - ".github/workflows/kaleidoscope-platform-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend and runtime syntax
        run: |
          node --check src/server.mjs
          node --check src/platform-frontend-shell.mjs
          node --check public/kaleidoscope-app.js

      - name: Run platform frontend tests
        run: node --test test/platform-frontend-shell.test.mjs

      - name: Run full foundation build
        run: npm run build

      - name: Prove browser and machine truth boundaries
        run: |
          PORT=10080 node src/server.mjs >/tmp/kaleidoscope-platform-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10080/health >/dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent -H 'Accept: text/html' http://127.0.0.1:10080/ \
            | grep -q 'Inspect transformations, not conclusions'

          curl --fail --silent -H 'Accept: application/json' http://127.0.0.1:10080/ \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.platform!=='kaleidoscope'||v.browser_root!=='/app'||v.database_state!=='projection_substrate_applied_empty_runtime_adapter_not_bound'||v.database_table_count!==16||v.database_function_count!==3||v.database_trigger_count!==17||v.database_row_count!==0||!String(v.legislative_consequence_state).includes('stage_1_2'))process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/platform/read-model \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);const e=v.engine_specimens&&v.engine_specimens[0];if(v.platform!=='kaleidoscope'||v.deterministic!==true||v.summary.active_source_artifacts!==41||v.summary.database_tables!==16||v.summary.database_rows!==0||v.database_substrate.function_count!==3||v.database_substrate.trigger_count!==17||v.database_substrate.migration_history.length!==2||v.database_substrate.runtime_database_write_path_proven!==false||!e||e.structural_delta_count!==12||e.consequence_edge_count!==6||e.platform_binding_count!==6||e.projection_executed!==false)process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/status \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.supabase_table_count!==16||v.supabase_function_count!==3||v.supabase_trigger_count!==17||v.supabase_row_count!==0||v.runtime_persistence_adapter_state!=='not_bound'||v.persisted_projection_run_count!==0)process.exit(1)})"
