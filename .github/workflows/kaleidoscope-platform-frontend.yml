name: Kaleidoscope platform frontend

on:
  pull_request:
    paths:
      - "public/kaleidoscope-app.*"
      - "public/project2025-title-vii.*"
      - "public/local-preemption.*"
      - "src/platform-frontend-shell.mjs"
      - "src/project2025-frontend-shell.mjs"
      - "src/local-preemption-frontend-shell.mjs"
      - "src/legislative-impact-api.mjs"
      - "src/legislative-impact-surface.mjs"
      - "src/server.mjs"
      - "src/persistence-plan.mjs"
      - "src/local-preemption-family-slice.mjs"
      - "test/platform-frontend-shell.test.mjs"
      - "test/project2025-frontend-shell.test.mjs"
      - "test/local-preemption-frontend-shell.test.mjs"
      - "test/legislative-impact-api.test.mjs"
      - "fixtures/project2025-title-vii-*"
      - "fixtures/local-preemption-family-*"
      - "fixtures/eeoc_demographics_reporting_rollback_2026.impact_surface.v1.mjs"
      - "manifests/eeoc_demographics_reporting_rollback_2026.impact_classification.v1.json"
      - "lenses/*.v1.json"
      - "source_manifests/source_pack_2026_08_03_v3.json"
      - "receipts/kaleidoscope_supabase_projection_substrate_2026_08_09.v1.json"
      - "docs/KALEIDOSCOPE_PLATFORM_FRONTEND_V1.md"
      - "docs/LAYPERSON_COMPREHENSION_CONTRACT_V1.md"
      - ".github/workflows/kaleidoscope-platform-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend and runtime syntax
        run: |
          node --check src/server.mjs
          node --check src/platform-frontend-shell.mjs
          node --check src/project2025-frontend-shell.mjs
          node --check src/local-preemption-frontend-shell.mjs
          node --check src/legislative-impact-api.mjs
          node --check src/legislative-impact-surface.mjs
          node --check public/kaleidoscope-app.js
          node --check public/project2025-title-vii.js
          node --check public/local-preemption.js

      - name: Run citizen and Stage 3 API tests
        run: |
          node --test test/platform-frontend-shell.test.mjs
          node --test test/project2025-frontend-shell.test.mjs
          node --test test/local-preemption-frontend-shell.test.mjs
          node --test test/legislative-impact-api.test.mjs

      - name: Run full foundation build
        run: npm run build

      - name: Prove citizen workspace, Stage 3, and machine root agree
        run: |
          PORT=10080 node src/server.mjs >/tmp/kaleidoscope-platform-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10080/health >/dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent -H 'Accept: text/html' http://127.0.0.1:10080/ \
            | grep -q 'Understand the change before judging the conclusion'

          curl --fail --silent http://127.0.0.1:10080/project2025/title-vii \
            | grep -q 'Employment discrimination and gender identity'
          curl --fail --silent http://127.0.0.1:10080/project2025/title-vii \
            | grep -q 'U.S. Equal Employment Opportunity Commission'

          curl --fail --silent http://127.0.0.1:10080/state-local-protections \
            | grep -q 'When states limit local nondiscrimination protections'
          curl --fail --silent http://127.0.0.1:10080/state-local-protections \
            | grep -q 'Similar legal techniques do not prove coordination'

          curl --fail --silent -H 'Accept: application/json' http://127.0.0.1:10080/ \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.platform!=='kaleidoscope'||v.browser_root!=='/app'||v.bounded_scenario_count!==2||v.citizen_detail_surface_count!==2||v.legislative_consequence_stage_3_executed!==true||v.legislative_consequence_stage_3_impact_item_count!==5||v.legislative_consequence_stage_3_touched_actor_count!==14||v.legislative_consequence_stages_4_6_executed!==false||v.persistence_preflight_state!=='available_no_write'||v.persistence_live_write_authorized!==false||v.database_table_count!==19||v.database_row_count!==0)process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/platform/read-model \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);const p=v.scenarios.find(x=>x.policy_family_id==='local_lgbtq_ordinance_preemption.v1');const i=v.legislative_consequence.impact_surface;if(v.platform!=='kaleidoscope'||v.read_model_version!=='1.3.0'||v.deterministic!==true||v.summary.active_source_artifacts!==41||v.summary.scenario_count!==2||v.summary.lens_count!==7||v.summary.preserved_collision_count!==5||v.summary.database_tables!==19||v.summary.database_rows!==0||v.database_substrate.receipt_id!=='kaleidoscope_supabase_projection_substrate_2026_08_09.v1'||v.database_substrate.migration_history.length!==3||v.database_substrate.runtime_database_write_path_proven!==false||v.persistence_preflight.scenario_plans.length!==2||v.persistence_preflight.live_write_authorized!==false||!p||p.href!=='/state-local-protections'||p.receipt_href!=='/v1/scenarios/state-local-protections/receipt'||p.inspection_state!=='detailed_route_available'||v.system_boundary.legislative_consequence_stage_3!==true||v.system_boundary.legislative_consequence_stages_4_6!==false||!i||i.impact_item_count!==5||i.touched_actor_count!==14||i.effect_class_counts.economic!==0||i.deferred_reference_count!==1||i.atlas_historical_comparison_executed!==false)process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/legislative-consequence/eeoc/impact-surface \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.impact_item_count!==5||v.touched_actor_count!==14||v.effect_class_counts.legal!==3||v.effect_class_counts.operational!==2||v.effect_class_counts.economic!==0||v.effect_class_counts.administrative!==1||v.deferred_reference_count!==1||v.atlas_historical_comparison_executed!==false||v.lighthouse_accountability_executed!==false||v.checklist_instantiated!==false||v.no_mutation!==true||v.database_write_count!==0)process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/legislative-consequence/eeoc/impact-surface/receipt \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.atlas_historical_comparison_executed!==false||v.lighthouse_accountability_executed!==false||v.checklist_instantiated!==false||v.no_mutation!==true||v.database_write_count!==0)process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/project2025/title-vii/receipt \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.no_mutation!==true||v.database_write_count!==0)process.exit(1)})"

          curl --fail --silent http://127.0.0.1:10080/v1/scenarios/state-local-protections/receipt \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.no_mutation!==true||v.database_write_count!==0)process.exit(1)})"
